# Infraestructura de desarrollo. No es la de producción.
# Arranque: pnpm infra:up · Borrado con datos: pnpm infra:reset
name: crmapp-dev

services:
  postgres:
    # PostgreSQL 18 por un motivo concreto: trae uuidv7() nativo, y el ARCH
    # usa claves primarias UUID v7. Sin ella harían falta una extensión o
    # generarlas en la aplicación.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: crmapp
      POSTGRES_PASSWORD: crmapp_dev
      POSTGRES_DB: crmapp
    ports:
      # 55432 y no 5432: es habitual tener un PostgreSQL nativo instalado como
      # servicio ocupando el puerto estándar. Ceder el puerto es más barato que
      # pedirle a cada quien que pare su servicio.
      - '55432:5432'
    volumes:
      # OJO: en PostgreSQL 18+ el montaje va aquí y NO en .../data.
      # La imagen oficial cambió a directorios con el nombre de la versión mayor
      # para que `pg_upgrade --link` no cruce el límite del punto de montaje.
      # Montar en /var/lib/postgresql/data hace que el contenedor arranque y
      # muera con "unused mount/volume".
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crmapp -d crmapp']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Redis 7: aquí no hay ninguna función nueva que necesitemos, así que
    # gana la opción aburrida. BullMQ funciona igual con 7 y con 8.
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # S3 compatible en desarrollo. En produccion, R2.
    #
    # ## Por que ya no es MinIO
    #
    # Tercera vez que MinIO rompe esto. Primero desaparecio la imagen de
    # Bitnami; luego `minio/minio` de Docker Hub dejo de existir el
    # 16/09/2026; y el 25/09/2026, la de quay.io a la que se habia
    # repuntado empezo a contestar «unauthorized» hasta con la etiqueta
    # fijada. MinIO ha ido cerrando el acceso publico a su edicion
    # comunitaria, y fijar la version no protege de que cierren el grifo.
    #
    # `adobe/s3mock` es un S3 para tests, Apache-2.0 y publico. Los seis
    # tests de almacenamiento pasan con el, URL firmadas incluidas.
    #
    # Lo que se pierde es la consola web de MinIO en :9001, que servia para
    # mirar los archivos subidos a ojo. A cambio, esto arranca en segundos,
    # no necesita un contenedor aparte para crear el bucket, y **es la misma
    # imagen que usa el CI**: dos backends distintos son una diferencia que
    # solo se descubre cuando el CI se pone rojo y en la maquina funciona.
    image: adobe/s3mock:4.7.0
    environment:
      # Crea el bucket al levantar. Sin esto, el primer envio de media falla
      # con un error de S3 que no dice que falta el bucket.
      initialBuckets: crmapp-media
      # Los objetos sobreviven a un reinicio del contenedor, como con MinIO.
      root: /data
    ports:
      # 9000 fuera, como siempre: `.env` y los tests no cambian.
      - '9000:9090'
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9090 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Captura el correo saliente (invitaciones, avisos de plan) sin enviarlo.
    # Mailpit y no MailHog: MailHog está sin mantenimiento desde 2020.
    # Interfaz en http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  redisdata:
  s3data:
