# Infraestructura de desarrollo. No es la de producción.
# Arranque: pnpm infra:up · Borrado con datos: pnpm infra:reset
name: crmapp-dev

services:
  postgres:
    # PostgreSQL 18 por un motivo concreto: trae uuidv7() nativo, y el ARCH
    # usa claves primarias UUID v7. Sin ella harían falta una extensión o
    # generarlas en la aplicación.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: crmapp
      POSTGRES_PASSWORD: crmapp_dev
      POSTGRES_DB: crmapp
    ports:
      # 55432 y no 5432: es habitual tener un PostgreSQL nativo instalado como
      # servicio ocupando el puerto estándar. Ceder el puerto es más barato que
      # pedirle a cada quien que pare su servicio.
      - '55432:5432'
    volumes:
      # OJO: en PostgreSQL 18+ el montaje va aquí y NO en .../data.
      # La imagen oficial cambió a directorios con el nombre de la versión mayor
      # para que `pg_upgrade --link` no cruce el límite del punto de montaje.
      # Montar en /var/lib/postgresql/data hace que el contenedor arranque y
      # muera con "unused mount/volume".
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crmapp -d crmapp']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Redis 7: aquí no hay ninguna función nueva que necesitemos, así que
    # gana la opción aburrida. BullMQ funciona igual con 7 y con 8.
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3 compatible en desarrollo. En producción, R2.
    #
    # Desde quay.io y con versión fija: `minio/minio:latest` de Docker Hub
    # **dejó de existir** el 16/09/2026 (MinIO retiró de ahí la edición
    # comunitaria). Aquí seguía funcionando solo porque la imagen estaba en
    # la caché local de esta máquina; en una máquina nueva no arrancaba.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: crmapp
      MINIO_ROOT_PASSWORD: crmapp_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # Crea el bucket al arrancar. Sin esto, el primer envío de media falla
    # con un error de S3 que no dice que falta el bucket.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 crmapp crmapp_dev_secret &&
      mc mb --ignore-existing local/crmapp-media &&
      echo 'bucket crmapp-media listo'
      "

  mailpit:
    # Captura el correo saliente (invitaciones, avisos de plan) sin enviarlo.
    # Mailpit y no MailHog: MailHog está sin mantenimiento desde 2020.
    # Interfaz en http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  redisdata:
  miniodata:
