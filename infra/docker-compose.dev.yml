# Infraestructura de desarrollo. No es la de producción.
# Arranque: pnpm infra:up · Borrado con datos: pnpm infra:reset
name: crmapp-dev

services:
  postgres:
    # PostgreSQL 18 por un motivo concreto: trae uuidv7() nativo, y el ARCH
    # usa claves primarias UUID v7. Sin ella harían falta una extensión o
    # generarlas en la aplicación.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: crmapp
      POSTGRES_PASSWORD: crmapp_dev
      POSTGRES_DB: crmapp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crmapp -d crmapp']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Redis 7: aquí no hay ninguna función nueva que necesitemos, así que
    # gana la opción aburrida. BullMQ funciona igual con 7 y con 8.
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3 compatible en desarrollo. En producción, R2.
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: crmapp
      MINIO_ROOT_PASSWORD: crmapp_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # Crea el bucket al arrancar. Sin esto, el primer envío de media falla
    # con un error de S3 que no dice que falta el bucket.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 crmapp crmapp_dev_secret &&
      mc mb --ignore-existing local/crmapp-media &&
      mc anonymous set download local/crmapp-media &&
      echo 'bucket crmapp-media listo'
      "

  mailpit:
    # Captura el correo saliente (invitaciones, avisos de plan) sin enviarlo.
    # Mailpit y no MailHog: MailHog está sin mantenimiento desde 2020.
    # Interfaz en http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  redisdata:
  miniodata:
