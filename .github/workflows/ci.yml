name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Los tests de RLS necesitan una base real: la única forma de probar que
    # el aislamiento lo hace PostgreSQL y no nuestra aplicación es preguntarle
    # a PostgreSQL. Debe ser 18 o mayor por uuidv7().
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crmapp
          POSTGRES_PASSWORD: crmapp_dev
          POSTGRES_DB: crmapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crmapp -d crmapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # El semáforo por inquilino y el cableado de BullMQ se prueban contra
      # Redis real: lo que se comprueba —atomicidad de un script Lua,
      # serialización de msgpackr— no existe fuera de Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # En CI el service container expone el puerto estándar; en local se cede
      # el 5432 por si hay un PostgreSQL nativo instalado (ver README).
      TEST_PG_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      # Las guardas de arquitectura no necesitan dependencias: van primero
      # para que un fallo de diseño no espere a que instale medio npm.
      - name: Guardas de arquitectura
        run: bash scripts/check-architecture.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # Solo packages/storage habla con S3 de verdad. Va como paso y no como
      # service container: los services de Actions no admiten `command` y la
      # imagen oficial de MinIO lo necesita (`server /data`). La de Bitnami,
      # que no lo necesitaba, dejo de publicarse en Docker Hub.
      - name: MinIO (solo para packages/storage)
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=crmapp -e MINIO_ROOT_PASSWORD=crmapp_dev_secret             minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c             "mc alias set local http://localhost:9000 crmapp crmapp_dev_secret && mc mb --ignore-existing local/crmapp-media"

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
