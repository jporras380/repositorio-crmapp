name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Los tests de RLS necesitan una base real: la única forma de probar que
    # el aislamiento lo hace PostgreSQL y no nuestra aplicación es preguntarle
    # a PostgreSQL. Debe ser 18 o mayor por uuidv7().
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crmapp
          POSTGRES_PASSWORD: crmapp_dev
          POSTGRES_DB: crmapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crmapp -d crmapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # El semáforo por inquilino y el cableado de BullMQ se prueban contra
      # Redis real: lo que se comprueba —atomicidad de un script Lua,
      # serialización de msgpackr— no existe fuera de Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # En CI el service container expone el puerto estándar; en local se cede
      # el 5432 por si hay un PostgreSQL nativo instalado (ver README).
      TEST_PG_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      # Las guardas de arquitectura no necesitan dependencias: van primero
      # para que un fallo de diseño no espere a que instale medio npm.
      - name: Guardas de arquitectura
        run: bash scripts/check-architecture.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # Solo packages/storage habla con S3 de verdad, y necesita URL
      # firmadas que funcionen: es justo lo que ese test demuestra.
      #
      # ## Por que ya no es MinIO
      #
      # Tercera vez que MinIO rompe este paso. Primero desaparecio la imagen
      # de Bitnami; luego `minio/minio` de Docker Hub («repository does not
      # exist», 30 ejecuciones rojas); y el 25/09/2026, la de quay.io a la
      # que se habia repuntado empezo a contestar «unauthorized» hasta con la
      # etiqueta fijada. MinIO ha ido cerrando el acceso publico a su edicion
      # comunitaria, y fijar la version no protege de que cierren el grifo.
      #
      # `adobe/s3mock` es un S3 pensado para tests, Apache-2.0 y publico en
      # Docker Hub. Los seis tests de almacenamiento pasan tal cual, URL
      # firmadas de lectura y de subida incluidas, que es lo unico que se les
      # pide. Arranca mas rapido y no necesita `mc` para crear el bucket:
      # `initialBuckets` lo hace al levantar.
      #
      # Lo que se pierde es la consola web de MinIO, que en CI no la mira
      # nadie. En local se pierde tambien, y por eso el compose de desarrollo
      # cambia igual: dos backends distintos son una diferencia que solo se
      # descubre cuando el CI se pone rojo y en la maquina funciona.
      #
      # Va PINCHADA a una version. Una etiqueta movil es exactamente como se
      # rompio esto las tres veces.
      - name: S3 para packages/storage
        run: |
          docker run -d --name s3 -p 9000:9090 -e initialBuckets=crmapp-media             adobe/s3mock:4.7.0
          # El bucle TIENE que fallar si no arranca. Antes se agotaba en
          # silencio y el error salia mas abajo, con un mensaje que no dice
          # nada del contenedor.
          arrancado=no
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000; then arrancado=si; break; fi
            sleep 1
          done
          if [ "$arrancado" != si ]; then
            echo "El S3 de pruebas no respondio en 30 s. Sus logs:"
            docker logs s3 || true
            exit 1
          fi

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
